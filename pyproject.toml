[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "surgical-building"
version = "2.1.0"
description = "Deterministic 2D-to-3D architectural, prop, and skeletal character reconstruction engine for AI agents."
readme = "README.md"
authors = [
    { name = "TeacherEvan", email = "ewiebotha@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "3d",
    "architecture",
    "blender",
    "threejs",
    "photogrammetry",
    "build123d",
    "sat-solver",
    "ai-agents",
    "hermes",
    "antigravity",
    "cursor"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: 3D Modeling"
]

[project.optional-dependencies]
vision = ["opencv-python>=4.8.0", "numpy>=1.24.0"]
cad = ["build123d>=0.5.0"]
all = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "build123d>=0.5.0",
    "pytest>=7.0.0"
]

[project.scripts]
surgical-building = "surgical_building.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["surgical_building*", "runtime*", "scripts*", "schemas*"]
